# Render Blueprint: one free web service (API + built web app), next to Supabase in Frankfurt.
# Render → New → Blueprint → pick this repo. Values marked `sync: false` are entered in Render.
services:
  - type: web
    name: love-locks
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: TRUST_PROXY
        value: "1"
      - key: SEED_DEMO
        value: "1"
      - key: SERVER_PEPPER
        generateValue: true
      # Supabase → Connect → Session pooler URI (postgresql://...:password@...pooler.supabase.com:5432/postgres)
      - key: SUPABASE_DATABASE_URL
        sync: false
      # Shown on /privacy and /terms (read at build time).
      - key: VITE_CONTACT_EMAIL
        sync: false
      # Comma-separated account emails allowed to moderate reports.
      - key: ADMIN_EMAILS
        sync: false
